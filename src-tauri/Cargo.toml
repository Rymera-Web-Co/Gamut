[package]
name = "gamut"
version = "0.1.0"
description = "Gamut — a local git app for reviewing PRs and browsing history"
authors = ["Rymera"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gamut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
# default-features disabled to skip ssh/https (openssl/libssh2) — git ops here are
# local read-only; network fetch in M3 goes through the git CLI. libgit2 is still vendored.
git2 = { version = "0.20", default-features = false }
# GitHub: token in the OS keychain (release builds), REST over rustls.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
