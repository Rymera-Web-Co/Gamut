[package]
name = "gamut"
version = "0.7.0"
description = "Gamut — a local git app for reviewing PRs and browsing history"
authors = ["Rymera"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gamut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
# Native desktop notifications for background terminal events (issue #28).
tauri-plugin-notification = "2"
# In-app auto-update (issue #1): `updater` checks a signed `latest.json` on the
# GitHub Release, then downloads + installs the new bundle; `process` relaunches
# the app once the install completes.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Typed endpoint URLs for the updater builder (`UpdaterBuilder::endpoints` takes
# `Vec<url::Url>`); `url` is already in the tree via the updater plugin.
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
# default-features disabled to skip ssh/https (openssl/libssh2) — git ops here are
# local read-only; network fetch in M3 goes through the git CLI. libgit2 is still vendored.
git2 = { version = "0.20", default-features = false }
# GitHub: token in the OS keychain (release builds), REST over rustls.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Inline GitHub attachment images (issue #36): the webview has no github.com
# session cookies, so authenticated attachment URLs are fetched with the user's
# token in the backend and handed to the webview as base64 data URLs.
base64 = "0.22"
# Watch each repo's .git so external branch switches/commits reflect live.
notify = "7"
notify-debouncer-mini = "0.5"
# Cross-platform PTY backing the per-repo integrated terminal. A real TTY is
# required for resize, colors, line discipline and interactive apps (vim/htop);
# bare piped stdio can't provide those.
portable-pty = "0.8"
# Repo-wide find & replace: `ignore` is ripgrep's gitignore-aware directory
# walker (with glob overrides); `regex` powers the match/replace engine and
# backs the case-sensitive / whole-word / regex toggles.
ignore = "0.4"
regex = "1"
