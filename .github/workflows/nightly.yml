name: Nightly

on:
  schedule:
    # 12:00 UTC = 10pm Australia/Brisbane (UTC+10, no DST).
    - cron: '0 12 * * *'
  workflow_dispatch:

# Serialize nightly runs; never cancel an in-progress build (a cancelled run
# could delete the `nightly` release in cleanup and leave nothing published).
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Decide whether there's anything new to build. The rolling `nightly` release
  # records the commit it was built from in its targetCommitish; if main's HEAD
  # already matches that, a fresh build would just republish the same code, so
  # we skip it. If the release doesn't exist yet, `gh` fails and we proceed.
  guard:
    name: Guard (any new commits?)
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev="$(gh release view nightly \
            --repo "${{ github.repository }}" \
            --json targetCommitish -q .targetCommitish 2>/dev/null || true)"
          echo "previous nightly commit: '${prev:-<none>}'"
          echo "current HEAD:            '${{ github.sha }}'"
          if [ "$prev" = "${{ github.sha }}" ]; then
            echo "No new commits since the last nightly — skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  # Delete the previous rolling release + its tag so stale assets and an old
  # latest.json manifest don't linger alongside the fresh ones.
  cleanup:
    name: Cleanup previous nightly
    needs: guard
    if: needs.guard.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --repo "${{ github.repository }}" --cleanup-tag --yes || true

  build:
    name: Build (${{ matrix.name }})
    needs: cleanup
    if: needs.guard.outputs.should_build == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            name: macos-x64
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            name: linux-x64
            target: ''
            args: ''
          - platform: windows-latest
            name: windows-x64
            target: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Stamp a date-based nightly version (e.g. 0.4.1-nightly.20260618) into
      # tauri.conf.json + package.json before building. This is build-only — the
      # change is never committed. See scripts/set-nightly-version.sh for the
      # version-ordering rationale.
      - name: Stamp nightly version
        run: bash scripts/set-nightly-version.sh "$(date -u +'%Y%m%d')"

      - name: Build and release nightly
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same updater signing secrets as release.yml — tauri-action signs the
          # update package and uploads latest.json to the `nightly` release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Publish to the fixed rolling `nightly` tag as a prerelease.
          tagName: nightly
          releaseName: "Gamut Nightly"
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}

# NOTE: the `publish-cask` job from release.yml is intentionally omitted here.
# The stable Homebrew cask must keep pointing at stable releases only — nightly
# builds never touch the tap.
