name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + format + typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  backend:
    name: Backend (fmt + clippy + check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Test
        working-directory: src-tauri
        run: cargo test

  # Windows-only code (`#[cfg(windows)]`) is never compiled or tested by the
  # ubuntu `backend` job, and `nightly.yml`'s windows build only runs
  # `tauri-action`, never `cargo test`. This job gives PR-time coverage for the
  # Windows paths: `cargo check --all-targets` compiles the `#[cfg(windows)]`
  # blocks (the real signal today), and `cargo test` runs any `#[cfg(windows)]`
  # assertions as Windows-specific tests land. fmt/clippy already run
  # cross-platform on the ubuntu job, so they aren't repeated here. See #221.
  backend-windows:
    name: Backend (windows check + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Test
        working-directory: src-tauri
        run: cargo test
