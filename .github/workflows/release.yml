name: Release

on:
  push:
    tags:
      - 'alpha-*'
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            name: macos-x64
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            name: linux-x64
            target: ''
            args: ''
          - platform: windows-latest
            name: windows-x64
            target: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # On a tag push, attach artifacts to a GitHub Release for that tag.
          # On manual workflow_dispatch, tagName is empty so tauri-action only
          # builds (artifacts are captured by the upload-artifact step below).
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Gamut {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}

      - name: Upload build artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: gamut-${{ matrix.name }}
          # `**` matches zero or more dirs, so this covers both the macOS
          # per-target layout (target/<triple>/release/bundle) and the
          # Linux/Windows layout (target/release/bundle).
          path: src-tauri/target/**/release/bundle/**/*
          if-no-files-found: error

  # Publish the macOS Homebrew cask to the tap repo (Option A in #3). Runs only
  # on tag pushes, after the build job has attached the .dmg assets to the
  # release. Regenerates the cask from the published artifacts and pushes it to
  # Rymera-Web-Co/homebrew-gamut, so `brew install --cask gamut` always points
  # at the latest release.
  #
  # One-time setup (see homebrew/README.md):
  #   1. Create the public tap repo Rymera-Web-Co/homebrew-gamut.
  #   2. Add a HOMEBREW_TAP_TOKEN secret — a token with contents:write on the
  #      tap repo (the default GITHUB_TOKEN can't push to another repo).
  publish-cask:
    name: Publish Homebrew Cask
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Generate cask for ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/update-cask.sh "${{ github.ref_name }}" cask-out/Casks/gamut.rb

      - name: Push cask to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set — see homebrew/README.md for setup."
            exit 1
          fi
          tap_dir="$(mktemp -d)"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/Rymera-Web-Co/homebrew-gamut.git" "$tap_dir"
          mkdir -p "$tap_dir/Casks"
          cp cask-out/Casks/gamut.rb "$tap_dir/Casks/gamut.rb"
          cd "$tap_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Cask already up to date for ${{ github.ref_name }}."
            exit 0
          fi
          git add Casks/gamut.rb
          git commit -m "gamut ${{ github.ref_name }}"
          git push
