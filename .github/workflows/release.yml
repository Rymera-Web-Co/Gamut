name: Release

on:
  push:
    tags:
      - 'alpha-*'
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            name: macos-x64
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            name: linux-x64
            target: ''
            args: ''
          - platform: windows-latest
            name: windows-x64
            target: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Notarization uses an App Store Connect API key (a .p8 file). The key is
      # stored base64-encoded in a secret; decode it to a file the build can
      # point APPLE_API_KEY_PATH at. macOS runners only.
      - name: Decode Apple API key (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_BASE64:-}" ]; then
            echo "::error::APPLE_API_KEY_BASE64 secret is empty or unset — cannot notarize" >&2
            exit 1
          fi
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (issue #1). With createUpdaterArtifacts enabled,
          # tauri-action signs the update package and, on tag pushes, also
          # generates and uploads `latest.json` to the release. The private key
          # + password are repo secrets — see docs/features/updates.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID signing + notarization. tauri-action imports the
          # certificate into a temporary keychain, signs the app with the
          # hardened runtime, then notarizes and staples it using the App Store
          # Connect API key. Ignored on Linux/Windows. A stable Developer ID
          # signature (vs the previous ad-hoc signing) keeps macOS TCC grants and
          # keychain items valid across auto-updates.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple_api_key.p8
        with:
          # On a tag push, attach artifacts to a GitHub Release for that tag.
          # On manual workflow_dispatch, tagName is empty so tauri-action only
          # builds (artifacts are captured by the upload-artifact step below).
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Gamut {0}', github.ref_name) || '' }}
          releaseDraft: false
          # `alpha-*` tags publish as prereleases; `v*` tags are full releases.
          # The updater endpoint (releases/latest/download/latest.json) only
          # resolves to non-prerelease releases, so a `v*` tag is what actually
          # delivers in-app auto-updates.
          prerelease: ${{ startsWith(github.ref_name, 'alpha-') }}
          args: ${{ matrix.args }}

      - name: Upload build artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: gamut-${{ matrix.name }}
          # `**` matches zero or more dirs, so this covers both the macOS
          # per-target layout (target/<triple>/release/bundle) and the
          # Linux/Windows layout (target/release/bundle).
          path: src-tauri/target/**/release/bundle/**/*
          if-no-files-found: error

  # Arch Linux package. GitHub has no Arch runner, so this runs in an
  # archlinux container. It repackages the .deb the `build` job just attached to
  # the release (a tar extract — no Rust/Node toolchain needed), so it must wait
  # for that job to finish.
  arch-package:
    name: Arch package (gamut-bin)
    needs: build
    # Only a tag push publishes a release to attach the package to. `!cancelled()`
    # instead of a plain success gate: `build` uses fail-fast: false, so a failure
    # in the macOS or Windows leg must not silently drop this asset from an
    # otherwise complete release. If the Linux leg is the one that failed, the
    # download below fails loudly instead.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Install packaging tools
        run: |
          # --disable-sandbox: pacman 7 sandboxes downloads with seccomp, and the
          # container's default seccomp profile blocks the seccomp() syscall
          # itself ("error restricting syscalls via seccomp"). The container is
          # ephemeral and only installs from the official repos.
          pacman -Syu --noconfirm --needed --disable-sandbox \
            base-devel git jq github-cli pacman-contrib

      - uses: actions/checkout@v4

      - name: Build the pacman package from the release .deb
        env:
          # No token here — the .deb is fetched from a public release URL.
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The .deb filename carries the app version, while the release URL
          # carries the tag — the two differ for `alpha-*` releases, so pin both.
          version=$(jq -r .version src-tauri/tauri.conf.json)
          work=$(mktemp -d)
          # awk, not sed: the tag reaches it as a variable, so no character in a
          # tag name can act as a delimiter or be re-evaluated.
          awk -v ver="$version" -v tag="$TAG" '
            /^pkgver=/ { print "pkgver=" ver; next }
            /^_tag=/   { printf "_tag=\"%s\"\n", tag; next }
                       { print }
          ' packaging/arch/PKGBUILD > "$work/PKGBUILD"

          # makepkg refuses to run as root.
          useradd --create-home builder
          chown -R builder:builder "$work"

          # updpkgsums re-pins sha256sums to the .deb of THIS release — the hash
          # committed in the PKGBUILD only matches the release it was pinned for.
          # --nodeps: package() only unpacks the .deb, so the runtime deps
          # (webkit2gtk-4.1, gtk3) need not be installed in the container.
          sudo -u builder -H bash -c "cd '$work' && updpkgsums && makepkg --nodeps --force"

          echo "PKGBUILD_DIR=$work" >> "$GITHUB_ENV"
          echo "Built package contents:"
          bsdtar -tf "$work"/gamut-bin-*.pkg.tar.zst

      - name: Attach the package to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env, never interpolated into the script: a tag name is
          # attacker-controlled text and `${{ }}` substitution happens before
          # bash parses the line.
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "$PKGBUILD_DIR"/gamut-bin-*.pkg.tar.zst \
            --repo "$GITHUB_REPOSITORY" --clobber

# The Homebrew cask is published from a maintainer's machine, not from CI — see
# homebrew/README.md. After this workflow attaches the .dmg assets to the
# release, run `scripts/publish-cask.sh <tag>` locally to render and push the
# cask to Rymera-Web-Co/homebrew-gamut over your own git auth. This keeps the
# release pipeline free of any cross-repo push token (no HOMEBREW_TAP_TOKEN).
